name: Hourly IP Text Process
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ip-text-process
  cancel-in-progress: false

jobs:
  process_task:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置Python3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 执行原IP处理脚本
        run: python process_ip.py

      - name: 合并清洗（去空行去重）
        run: |
          set -uo pipefail
          mkdir -p output
          shopt -s nullglob

          # 收集 output 下所有 txt，排除最终产物 all.txt
          src=()
          for f in output/*.txt; do
            [ "$f" = "output/all.txt" ] && continue
            src+=("$f")
          done

          # 如果没有其他分组文件，就处理 all.txt 自己（原地清洗）
          if [ ${#src[@]} -eq 0 ]; then
            if [ -f output/all.txt ]; then
              src=("output/all.txt")
            else
              echo "output 下没有任何 txt"
              ls -la output
              exit 1
            fi
          fi

          echo "合并源: ${src[*]}"

          TMP=$(mktemp)
          awk '
            {
              sub(/\r$/, "")
              gsub(/^[[:space:]]+|[[:space:]]+$/, "")
              if ($0 == "") next
              if ($0 ~ /^#/) next
              if (seen[$0]++) next
              print
            }
          ' "${src[@]}" > "$TMP"

          mv "$TMP" output/all.txt
          echo "生成 output/all.txt, 行数: $(wc -l < output/all.txt)"

      - name: 校验无空行
        run: |
          test -f output/all.txt || { echo "all.txt 不存在"; ls -la output; exit 1; }
          echo "总行数: $(wc -l < output/all.txt)"
          B=$(grep -c '^$' output/all.txt || true)
          echo "空行数: $B"
          test "$B" = "0" || { echo "仍有空行"; exit 1; }

      - name: 配置Git提交信息
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"

      - name: 提交并推送
        run: |
          git add output/
          if git diff --cached --quiet; then
            echo "无更新"
          else
            git commit -m "自动更新IP文本 $(date '+%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin main
            git push origin main
          fi
