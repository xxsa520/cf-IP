name: Hourly IP Text Process
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write          # 新版仓库默认只读，必须显式开启

concurrency:               # 防止整点任务重叠互相覆盖
  group: ip-text-process
  cancel-in-progress: false

jobs:
  process_task:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置Python3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 执行IP处理脚本
        run: python process_ip.py

      - name: 校验输出无空行
        run: |
          echo "总行数: $(wc -l < output/all.txt)"
          echo "空行数: $(grep -c '^$' output/all.txt || true)"
          test "$(grep -c '^$' output/all.txt || true)" = "0" \
            || { echo "输出存在空行"; exit 1; }

      - name: 配置Git提交信息
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"

      - name: 提交并推送更新文件
        run: |
          git add output/
          if git diff --cached --quiet; then
            echo "无文件更新，跳过提交"
          else
            git commit -m "自动更新IP文本 $(date '+%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin main
            git push origin main
          fi
