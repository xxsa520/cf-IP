name: Hourly IP Text Process
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ip-text-process
  cancel-in-progress: false

jobs:
  process_task:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置Python3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 执行原IP处理脚本
        run: python process_ip.py

      - name: 清洗 all_ip.txt（每个IP一行，无空行，去重）
        run: |
          set -uo pipefail
          TARGET="output/all_ip.txt"

          if [ ! -f "$TARGET" ]; then
            echo "找不到 $TARGET"
            ls -la output/ || true
            exit 1
          fi

          echo "===== 清洗前 ====="
          echo "行数=$(wc -l < "$TARGET"), 空行=$(grep -c '^$' "$TARGET" || true)"
          echo "--- 前 10 行（cat -A 显示不可见字符）---"
          head -10 "$TARGET" | cat -A

          # 核心：按空白拆成 token，每个 token 输出一行
          #   去 BOM、去 CR、去首尾空白、去空行、去注释行、全局去重
          perl -CSDA -Mutf8 -ne '
            s/^\x{FEFF}//;
            s/\r$//;
            s/^[\s\x{3000}\x{200B}\x{200C}\x{200D}\x{FEFF}]+//;
            s/[\s\x{3000}\x{200B}\x{200C}\x{200D}\x{FEFF}]+$//;
            next if /^$/;
            next if /^#/;
            for my $tok (split /\s+/, $_) {
              next if $tok eq "";
              next if $seen{$tok}++;
              print "$tok\n";
            }
          ' "$TARGET" > "$TARGET.tmp"

          mv "$TARGET.tmp" "$TARGET"

          echo "===== 清洗后 ====="
          echo "行数=$(wc -l < "$TARGET"), 空行=$(grep -c '^$' "$TARGET" || true)"
          echo "--- 前 10 行 ---"
          head -10 "$TARGET" | cat -A

      - name: 校验（每个IP一行 + 无空行）
        run: |
          TARGET="output/all_ip.txt"

          # 1) 无空行
          B=$(grep -c '^$' "$TARGET" || true)
          echo "空行数: $B"
          test "$B" = "0" || { echo "❌ 存在空行"; exit 1; }

          # 2) 每行只有一个 token（没有空格分隔的多个IP）
          MULTI=$(awk 'NF>1' "$TARGET" | wc -l)
          echo "含多个 token 的行数: $MULTI"
          test "$MULTI" = "0" || { echo "❌ 有行包含空格分隔的多个IP"; awk 'NF>1' "$TARGET" | head; exit 1; }

          echo "✅ 每个IP独占一行，无空行"

      - name: 配置Git提交信息
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"

      - name: 提交并推送
        run: |
          git add output/
          if git diff --cached --quiet; then
            echo "无更新"
          else
            git commit -m "自动更新IP文本 $(date '+%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin main
            git push origin main
          fi
