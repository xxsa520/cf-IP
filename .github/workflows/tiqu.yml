name: Hourly IP Text Process
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ip-text-process
  cancel-in-progress: false

jobs:
  process_task:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置Python3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 执行原IP处理脚本
        run: python process_ip.py

      - name: 合并清洗（去空行/全角空格/零宽字符/去重）
        run: |
          set -uo pipefail
          mkdir -p output
          shopt -s nullglob

          src=()
          for f in output/*.txt; do
            [ "$f" = "output/all.txt" ] && continue
            src+=("$f")
          done

          # output 下没有别的 txt → 回退到仓库根目录的源文件
          if [ ${#src[@]} -eq 0 ]; then
            for f in yongbusi.txt 世界级cf域名.txt; do
              [ -f "$f" ] && src+=("$f")
            done
          fi

          if [ ${#src[@]} -eq 0 ]; then
            echo "没有找到任何源文件"; ls -la; exit 1
          fi
          echo "合并源: ${src[*]}"

          # Perl 清洗：BOM + CR + 全角空格 + 零宽字符 + 首尾空白 + 空行 + 注释 + 去重
          perl -CSDA -Mutf8 -ne '
            s/^\x{FEFF}//;
            s/\r$//;
            s/^[\s\x{3000}\x{200B}\x{200C}\x{200D}\x{FEFF}]+//;
            s/[\s\x{3000}\x{200B}\x{200C}\x{200D}\x{FEFF}]+$//;
            next if /^$/;
            next if /^#/;
            next if $seen{$_}++;
            print;
          ' "${src[@]}" > output/all.txt.tmp

          mv output/all.txt.tmp output/all.txt

          echo "总行数: $(wc -l < output/all.txt)"
          echo "空行数: $(grep -c '^$' output/all.txt || true)"

      - name: 校验无空行
        run: |
          test -f output/all.txt || { echo "all.txt 不存在"; ls -la output; exit 1; }
          B=$(grep -c '^$' output/all.txt || true)
          echo "空行数: $B"
          test "$B" = "0" || { echo "仍有空行"; head -30 output/all.txt | cat -A; exit 1; }

      - name: 配置Git提交信息
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"

      - name: 提交并推送
        run: |
          git add output/
          if git diff --cached --quiet; then
            echo "无更新"
          else
            git commit -m "自动更新IP文本 $(date '+%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin main
            git push origin main
          fi
